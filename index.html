<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance Checker</title>
<style>
  :root {
    --paper: #f3f6f4;
    --card: #ffffff;
    --ink: #17302b;
    --muted: #5d716c;
    --line: #d5dedb;
    --present: #1f8a5b;
    --late: #c98a0b;
    --absent: #c0392b;
    --accent: #17302b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #101b18;
      --card: #172622;
      --ink: #e6efeb;
      --muted: #93a8a2;
      --line: #2a3d38;
      --present: #4cc38a;
      --late: #e5b14a;
      --absent: #ef7b6d;
      --accent: #e6efeb;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: 2rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; align-items: end; }
  label { font-size: .85rem; color: var(--muted); display: block; margin-bottom: 4px; }
  input[type=date], input[type=text] {
    font: inherit; padding: 9px 12px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--card); color: var(--ink);
  }
  input[type=text] { flex: 1; min-width: 180px; }
  button {
    font: inherit; cursor: pointer; padding: 9px 16px; border-radius: 6px;
    border: 1px solid var(--accent); background: var(--accent); color: var(--paper);
  }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--late); outline-offset: 2px; }
  .summary { display: flex; gap: 20px; margin: 20px 0; font-size: .95rem; }
  .summary b { font-size: 1.4rem; display: block; }
  .s-present b { color: var(--present); }
  .s-late b { color: var(--late); }
  .s-absent b { color: var(--absent); }
  .row {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; padding: 12px 14px; margin-bottom: 8px;
  }
  .name { flex: 1; min-width: 140px; font-weight: 600; }
  .choices { display: flex; gap: 6px; }
  .choices button {
    padding: 6px 12px; font-size: .9rem; background: transparent;
    color: var(--muted); border-color: var(--line);
  }
  .choices button.on.present { background: var(--present); border-color: var(--present); color: #fff; }
  .choices button.on.late { background: var(--late); border-color: var(--late); color: #fff; }
  .choices button.on.absent { background: var(--absent); border-color: var(--absent); color: #fff; }
  .remove { padding: 4px 10px; font-size: .85rem; }
  .empty { color: var(--muted); padding: 28px 0; text-align: center; }
  .footer { display: flex; gap: 8px; margin-top: 20px; }
</style>
</head>
<body>
<main>
  <h1>Attendance Checker</h1>
  <p class="sub">Add your students, pick a date, and mark each one. Saved in this browser.</p>

  <div class="bar">
    <div>
      <label for="date">Date</label>
      <input type="date" id="date">
    </div>
    <div style="flex:1; min-width:200px">
      <label for="newName">Add student</label>
      <div style="display:flex; gap:8px">
        <input type="text" id="newName" placeholder="Full name">
        <button id="add">Add student</button>
      </div>
    </div>
  </div>

  <div class="summary" id="summary" aria-live="polite"></div>
  <div id="list"></div>

  <div class="footer">
    <button class="ghost" id="allPresent">Mark all present</button>
    <button class="ghost" id="csv">Download CSV</button>
  </div>
</main>

<script>
  const KEY = "attendance-v1";
  let state = { students: [], records: {} }; // records[date][studentId] = present|late|absent

  try { state = JSON.parse(localStorage.getItem(KEY)) || state; } catch (e) {}

  const $ = (id) => document.getElementById(id);
  const dateEl = $("date");
  dateEl.value = new Date().toISOString().slice(0, 10);

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function addStudent() {
    const name = $("newName").value.trim();
    if (!name) return;
    state.students.push({ id: Date.now().toString(36), name });
    $("newName").value = "";
    save(); render();
  }

  function mark(id, status) {
    const d = dateEl.value;
    state.records[d] = state.records[d] || {};
    state.records[d][id] = status;
    save(); render();
  }

  function removeStudent(id) {
    state.students = state.students.filter((s) => s.id !== id);
    for (const d in state.records) delete state.records[d][id];
    save(); render();
  }

  function render() {
    const d = dateEl.value;
    const rec = state.records[d] || {};
    const list = $("list");
    list.innerHTML = "";

    if (!state.students.length) {
      list.innerHTML = '<p class="empty">No students yet. Add your first student above.</p>';
    }

    state.students.forEach((s) => {
      const row = document.createElement("div");
      row.className = "row";
      const choices = ["present", "late", "absent"].map((st) =>
        `<button class="${st} ${rec[s.id] === st ? "on" : ""}" data-id="${s.id}" data-st="${st}">${st[0].toUpperCase() + st.slice(1)}</button>`
      ).join("");
      row.innerHTML = `<span class="name"></span><div class="choices">${choices}</div>
        <button class="ghost remove" data-remove="${s.id}" aria-label="Remove student">Remove</button>`;
      row.querySelector(".name").textContent = s.name;
      list.appendChild(row);
    });

    const count = (st) => state.students.filter((s) => rec[s.id] === st).length;
    const unmarked = state.students.length - count("present") - count("late") - count("absent");
    $("summary").innerHTML = `
      <div class="s-present"><b>${count("present")}</b>Present</div>
      <div class="s-late"><b>${count("late")}</b>Late</div>
      <div class="s-absent"><b>${count("absent")}</b>Absent</div>
      <div><b>${unmarked}</b>Not marked</div>`;
  }

  $("list").addEventListener("click", (e) => {
    const t = e.target;
    if (t.dataset.st) mark(t.dataset.id, t.dataset.st);
    if (t.dataset.remove && confirm("Remove this student and their records?")) removeStudent(t.dataset.remove);
  });

  $("add").addEventListener("click", addStudent);
  $("newName").addEventListener("keydown", (e) => { if (e.key === "Enter") addStudent(); });
  dateEl.addEventListener("change", render);

  $("allPresent").addEventListener("click", () => {
    const d = dateEl.value;
    state.records[d] = state.records[d] || {};
    state.students.forEach((s) => (state.records[d][s.id] = "present"));
    save(); render();
  });

  $("csv").addEventListener("click", () => {
    const dates = Object.keys(state.records).sort();
    const rows = [["Student", ...dates]];
    state.students.forEach((s) =>
      rows.push([s.name, ...dates.map((d) => (state.records[d] || {})[s.id] || "")])
    );
    const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = "attendance.csv";
    a.click();
  });

  render();
</script>
</body>
</html>
